  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-workflow
  disabled: true
- id: workflow-ptc
  disabled: true
- id: ptc-runtime
  disabled: true
- id: tool-goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: tool-todo
  disabled: true
