# Research code is returned as structured files and applied by the plugin.
# Web tools retain DSH's public-destination validation; no shell or local tools.
- id: sandbox-policy
  config:
    mode: read-only
- id: approval
  config:
    policy: ask
- id: permission
  config:
    defaultPreset: read-only
- id: tool-bash
